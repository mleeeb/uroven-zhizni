name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Собрать APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Подготовить файл
        run: cp app/build/outputs/apk/release/app-release.apk uroven-zhizni.apk

      - uses: actions/upload-artifact@v4
        with:
          name: uroven-zhizni-apk
          path: uroven-zhizni.apk

      - name: Опубликовать на странице Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest uroven-zhizni.apk \
            --target "${{ github.sha }}" \
            --title "Уровень жизни, сборка ${{ github.run_number }}" \
            --notes "Скачай uroven-zhizni.apk на телефон с Android и установи. Новая версия ставится поверх старой, данные сохраняются." \
            --latest
