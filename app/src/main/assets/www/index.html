<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Уровень жизни</title>
<style>
@font-face{font-family:'Press Start 2P';src:url('fonts/PressStart2P-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/IBMPlexMono-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/IBMPlexMono-Medium.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/IBMPlexMono-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
/* Layout: one-column game screen (max 480px), hero stage centered, game windows below, fixed bottom nav. Single dark "night RPG" world by choice. */
:root{
  --bg:#1B1E3A; --bg2:#151833; --panel:#252A50; --panel2:#2F355F;
  --ink:#F4F1DE; --dim:#B3B2CC; --shadow:#0C0E22;
  --gold:#F2CC8F; --coral:#E07A5F; --sage:#81B29A; --steel:#3D5A80; --sky:#8FB3E0;
  --px:'Press Start 2P', 'Courier New', monospace;
  --body:'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.px{font-family:var(--px);letter-spacing:.02em;line-height:1.7}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;background:var(--bg)}
.brand{font-family:var(--px);font-size:10px;color:var(--gold)}
.btn-text{background:none;border:0;font-family:var(--px);font-size:9px;color:var(--dim);padding:8px 0}
.btn-text:hover{color:var(--ink)}

.banner{display:flex;flex-direction:column;gap:10px;border:3px dashed var(--gold);padding:12px;margin-bottom:16px;font-size:14px}
.banner b{color:var(--gold)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--px);font-size:10px;line-height:1.4;padding:11px 14px;background:var(--gold);color:#1B1E3A;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);text-transform:uppercase}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn.danger{background:var(--coral);color:#1B1E3A}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hero */
.hero-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.hero-name{font-family:var(--px);font-size:16px;text-wrap:balance;word-break:break-word}
.hero-lvl{font-family:var(--px);font-size:11px;color:var(--sage)}
.hero-lvl b{font-size:34px;color:var(--gold);font-weight:400;vertical-align:-4px;margin-left:6px}
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:14px 0 6px}
.center{display:flex;flex-direction:column;align-items:center}
.side{display:flex;flex-direction:column;gap:10px;min-width:0;position:relative;z-index:1}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;width:100%;min-width:0;padding:8px 4px;background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);color:var(--ink)}
.slot.empty{border-style:dashed;background:transparent;box-shadow:none;color:var(--dim)}
.slot svg{width:24px;height:24px;shape-rendering:crispEdges}
.slot .sl{font-family:var(--px);font-size:7px;color:var(--dim)}
.slot .sv{font-size:13px;font-weight:600;line-height:1.3;word-break:break-word;font-variant-numeric:tabular-nums}
.slot .ss{font-family:var(--px);font-size:6px;line-height:1.5}
.sec-title{font-family:var(--px);font-size:10px;color:var(--gold);margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.sec-title::after{content:"";flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--panel2) 0 6px,transparent 6px 10px)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--dim)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.stage::before{content:"";position:absolute;left:50%;top:6px;width:220px;height:220px;transform:translateX(-50%);background:
  radial-gradient(circle,var(--panel2) 0 1px,transparent 1.5px) 0 0/22px 22px;opacity:.9;pointer-events:none}
.sprite{position:relative;image-rendering:pixelated;image-rendering:crisp-edges;width:144px;height:198px;animation:bob 1.2s steps(2) infinite}
.pedestal{position:relative;width:150px;height:14px;background:var(--steel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);margin-top:-6px}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.sprite{animation:none}}
.gear{display:block;margin:12px auto 4px;background:none;border:0;font-family:var(--px);font-size:8px;line-height:2;color:var(--dim);text-align:center;padding:4px 8px}
.gear:hover{color:var(--ink)}
.gear span{color:var(--gold)}

.meters{display:flex;flex-direction:column;gap:8px;margin:16px 0 20px}
.mlabel{display:flex;justify-content:space-between;gap:8px;font-family:var(--px);font-size:8px;color:var(--ink)}
.mlabel span{color:var(--dim)}
.pbar{height:18px;border:3px solid var(--ink);padding:2px;background:var(--bg2)}
.pbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,var(--coral) 8px 10px)}
.pbar.xp i{background:repeating-linear-gradient(90deg,var(--sage) 0 8px,var(--steel) 8px 10px)}
.rank-line{display:flex;align-items:center;gap:12px;margin-top:4px}
.rank{flex:none;width:44px;height:44px;display:grid;place-items:center;font-family:var(--px);font-size:18px;background:var(--panel2);border:3px solid var(--gold);color:var(--gold)}
.rank-line p{margin:0;font-size:13px;color:var(--dim)}
.rank-line p b{color:var(--ink);font-weight:500}

/* windows */
.box{background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:14px;margin-bottom:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h2{font-family:var(--px);font-size:11px;margin:0;color:var(--gold);font-weight:400;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box h2 small{font-size:8px;color:var(--dim)}
.eyebrow{font-family:var(--px);font-size:8px;color:var(--sage)}
.muted{color:var(--dim);font-size:13px;margin:0}

/* quests */
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-top:2px dashed var(--panel2)}
.q:first-child{border-top:0;padding-top:0}
.check{width:26px;height:26px;border:3px solid var(--ink);background:var(--bg2);padding:0;display:grid;place-items:center;font-family:var(--px);font-size:10px;color:var(--bg)}
.check.on{background:var(--sage)}
.q-title{font-size:15px;word-break:break-word}
.q.done .q-title{text-decoration:line-through;color:var(--dim)}
.q-meta{font-family:var(--px);font-size:7px;color:var(--dim);margin-top:4px}
.q-meta .late{color:var(--coral)}
.q-meta .soon{color:var(--gold)}
.q-xp{font-family:var(--px);font-size:8px;color:var(--gold);white-space:nowrap;padding-top:4px}
.x{background:none;border:0;color:var(--dim);font-family:var(--px);font-size:10px;padding:4px 2px}
.x:hover{color:var(--coral)}
details summary{cursor:pointer;font-family:var(--px);font-size:8px;color:var(--dim);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"► "}
details[open] summary::before{content:"▼ "}
.xp-table{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px;font-size:13px}
.xp-table li{display:flex;justify-content:space-between;gap:10px}
.xp-table b{font-family:var(--px);font-size:8px;color:var(--gold);font-weight:400}

.mainq{cursor:pointer;text-decoration:none;color:inherit}
.mainq .title{font-size:16px;font-weight:500;word-break:break-word}

/* stats */
.stat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.chip{font-family:var(--px);font-size:7px;padding:6px 8px;border:2px solid currentColor;white-space:nowrap}
.tone-good{color:var(--sage)} .tone-mid{color:var(--gold)} .tone-low{color:var(--coral)} .tone-none{color:var(--dim)}
.big{font-family:var(--px);font-size:26px;color:var(--ink);line-height:1.2;font-variant-numeric:tabular-nums}
.big small{font-family:var(--body);font-size:13px;color:var(--dim);margin-left:6px}
.gauge{position:relative;height:16px;background:var(--bg2);border:3px solid var(--ink)}
.gauge .band{position:absolute;top:0;bottom:0;background:var(--steel)}
.gauge .mark{position:absolute;top:-8px;width:6px;height:26px;margin-left:-3px;background:var(--gold);border:2px solid var(--ink)}
.gscale{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:-4px}
.gscale b{color:var(--ink);font-weight:500}
.how{font-size:12px;color:var(--dim);margin:0}
.inrow{display:flex;gap:8px}
.inrow input{min-width:0;flex:1}
.field{width:100%;background:var(--bg2);border:3px solid var(--ink);padding:9px 10px;font-size:15px;border-radius:0}
.field:focus{border-color:var(--gold);outline:none}
textarea.field{resize:vertical;min-height:90px}
.spark{display:block;width:100%;height:46px}
.src{font-size:11px;color:var(--dim);margin:0}

/* dream */
.dream-title{font-size:20px;font-weight:600;margin:0;line-height:1.35;word-break:break-word}
.why{margin:0;color:var(--dim);font-style:italic}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trophy{display:flex;gap:14px;align-items:center}
.past{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:13px}

/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center}
.cal-head .px{font-size:10px}
.navbtn{width:36px;height:36px;border:3px solid var(--ink);background:var(--panel2);font-family:var(--px);font-size:10px;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-family:var(--px);font-size:7px;color:var(--dim);text-align:center;padding:4px 0}
.day{position:relative;aspect-ratio:1;max-width:100%;border:2px solid var(--panel2);background:var(--bg2);font-size:13px;display:flex;align-items:flex-start;justify-content:flex-start;padding:3px 5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.day.out{visibility:hidden}
.day.today{border-color:var(--gold)}
.day.sel{background:var(--gold);color:#1B1E3A;border-color:var(--ink)}
.day .dots{position:absolute;left:5px;right:5px;bottom:4px;display:flex;gap:3px;flex-wrap:wrap}
.day .dots i{width:6px;height:6px;background:var(--sage)}
.day .dots i.k-quest,.day .dots i.k-step,.day .dots i.k-dream{background:var(--gold)}
.day .dots i.k-record{background:var(--coral)}
.day .dots i.k-plan{background:var(--dim)}
.day.sel .dots i{outline:1px solid #1B1E3A}

/* feed */
.lvl-sep{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-family:var(--px);font-size:9px;color:var(--gold)}
.lvl-sep::after{content:"";flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--panel2) 0 6px,transparent 6px 10px)}
.lvl-sep .r{border:2px solid var(--gold);padding:4px 6px}
.entry{background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.entry.auto{background:var(--bg2);border-style:dashed;box-shadow:none}
.entry-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--px);font-size:7px;color:var(--dim)}
.tag{padding:4px 6px;border:2px solid currentColor}
.tag.k-wealth{color:var(--sky)}
.day .dots i.k-wealth{background:var(--sky)}
.tag.k-manual{color:var(--sage)} .tag.k-quest,.tag.k-step,.tag.k-dream{color:var(--gold)} .tag.k-record{color:var(--coral)} .tag.k-plan,.tag.k-start{color:var(--dim)}
.entry p{margin:0;white-space:pre-wrap;word-break:break-word}
.entry .ph-main{display:block;width:100%;aspect-ratio:4/3;max-height:360px;object-fit:cover;border:3px solid var(--ink);background:var(--bg2);cursor:zoom-in}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.entry .ph-th{display:block;width:100%;aspect-ratio:1;max-width:100%;object-fit:cover;border:2px solid var(--ink);background:var(--bg2);cursor:zoom-in}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(8,9,24,.97);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.vw-top,.vw-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;font-family:var(--px);font-size:8px;color:var(--dim)}
.vw-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.vw-stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;will-change:transform;-webkit-user-drag:none}
.pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding-top:6px}
.pthumb{position:relative;aspect-ratio:1;border:2px solid var(--ink);background:var(--bg2);display:grid;place-items:center}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pdel{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border:2px solid var(--ink);background:var(--coral);color:#1B1E3A;font-size:11px;line-height:1;padding:0}
.padd{aspect-ratio:1;border:3px dashed var(--panel2);background:transparent;color:var(--gold);font-family:var(--px);font-size:16px;padding:0}
.pload{font-family:var(--px);color:var(--dim)}
.optgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.optgrid label{position:relative;min-width:0}
.optgrid input{position:absolute;opacity:0;width:1px;height:1px}
.optgrid span{display:flex;flex-direction:column;gap:5px;justify-content:center;min-height:54px;padding:8px;border:3px solid var(--panel2);background:var(--bg2);font-family:var(--px);font-size:8px;line-height:1.5;color:var(--ink);cursor:pointer;word-break:break-word}
.optgrid span small{font-size:6px;color:var(--dim)}
.optgrid input:checked+span{border-color:var(--gold);color:var(--gold)}
.optgrid input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.presetbtn{flex:1;min-width:0;padding:10px 4px;border:3px solid var(--panel2);background:var(--panel2);font-family:var(--px);font-size:7px;line-height:1.4;color:var(--ink)}
.presetbtn:active{transform:translate(1px,1px)}
.btn-mini{margin-top:8px;font-family:var(--px);font-size:7px;line-height:1.4;padding:7px 8px;background:var(--panel2);color:var(--gold);border:2px solid var(--gold)}
.q-xp.zero{color:var(--dim)}
.q.failed .q-title{color:var(--coral)}
.pxi{width:.85em;height:.85em;margin-right:3px;vertical-align:-.05em;fill:currentColor;shape-rendering:crispEdges}
.qcount{font-size:9px;text-decoration:none;color:var(--dim);white-space:nowrap}
.tag.k-fail{color:var(--coral)}
.day .dots i.k-fail{background:var(--coral)}
.entry-foot{display:flex;justify-content:space-between;align-items:center;font-family:var(--px);font-size:8px;color:var(--gold)}
.empty{border:3px dashed var(--panel2);padding:18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg2);border-top:3px solid var(--ink);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;color:var(--dim);text-decoration:none;font-family:var(--px);font-size:7px;border:2px solid transparent}
.nav a svg{width:20px;height:20px;shape-rendering:crispEdges}
.nav a.on{color:var(--gold);border-color:var(--gold);background:var(--panel)}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,9,24,.78);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:480px;max-height:100%;overflow-y:auto;background:var(--panel);border:3px solid var(--ink);border-bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.overlay{align-items:center;padding-bottom:16px}.sheet{border-bottom:3px solid var(--ink);box-shadow:6px 6px 0 var(--shadow)}}
.sheet h3{font-family:var(--px);font-size:12px;color:var(--gold);margin:0;font-weight:400}
.lbl{display:flex;flex-direction:column;gap:6px;font-family:var(--px);font-size:8px;color:var(--dim)}
.err{color:var(--coral);font-size:13px;margin:0}
.seg{display:flex;gap:8px}
.seg label{flex:1}
.seg input,.sw input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;text-align:center;padding:10px;border:3px solid var(--panel2);background:var(--bg2);font-family:var(--px);font-size:9px;color:var(--ink);cursor:pointer}
.seg input:checked+span{border-color:var(--gold);color:var(--gold)}
.seg input:focus-visible+span,.sw input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw label{position:relative}
.sw span{display:block;width:32px;height:32px;border:3px solid var(--panel2);cursor:pointer}
.sw input:checked+span{border-color:var(--ink);box-shadow:0 0 0 3px var(--gold)}
.look{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.look canvas{width:96px;height:132px;image-rendering:pixelated;background:var(--bg2);border:3px solid var(--panel2)}
.photo-prev img{max-width:100%;max-height:200px;border:3px solid var(--ink)}
.chk{display:flex;gap:10px;align-items:center;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--gold)}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--gold);color:#1B1E3A;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);font-family:var(--px);font-size:9px;line-height:1.6;padding:10px 14px;max-width:calc(100% - 32px);text-align:center}
.toast.levelup{background:var(--sage)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand">УРОВЕНЬ ЖИЗНИ</span>
    <button class="btn-text" id="profileBtn" data-act="profile">ПРОФИЛЬ</button>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<nav class="nav" aria-label="Разделы">
  <div class="nav-in">
    <a href="#hero" data-v="hero"><svg viewBox="0 0 8 8" aria-hidden="true"><rect x="2" y="0" width="4" height="3" fill="currentColor"/><rect x="1" y="4" width="6" height="4" fill="currentColor"/></svg>ГЕРОЙ</a>

const RU={medGross:73871,avgGross:100360,pm:18939,area:28.8,social:18,net:0.87};
const RU_MED=Math.round(RU.medGross*RU.net),RU_AVG=Math.round(RU.avgGross*RU.net);

function wealth(f){
  if(!f)return null;const ppl=Math.max(1,f.people||1);const o={};

  if(f.area){const a=f.area/ppl;o.area={v:a,max:60,band:[RU.social,RU.area]};

    else if(a<RU.area*1.3){o.area.rating='КАК В СРЕДНЕМ';o.area.tone='mid';}else{o.area.rating='ПРОСТОРНО';o.area.tone='good';}}
  return o;}

/* ---------- norms ---------- */
function lerp(pts,a){if(a<=pts[0][0])return pts[0][1];for(let i=1;i<pts.length;i++){if(a<=pts[i][0]){const[x0,y0]=pts[i-1],[x1,y1]=pts[i];return y0+(y1-y0)*(a-x0)/(x1-x0);}}return pts[pts.length-1][1];}
function phi(z){const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;}
const SQ={m:[[20,50],[45,45],[77,30]],f:[[20,47],[45,42],[65,33],[77,27]]};
const PU={m:{20:[36,29,22,17],30:[30,22,17,12],40:[25,17,13,10],50:[21,13,10,7],60:[18,11,8,5]},
          f:{20:[30,21,15,10],30:[27,20,13,8],40:[24,15,11,5],50:[21,11,7,2],60:[17,12,5,2]}};
const STAT_META={
  squat:{title:'ПРИСЕДАНИЯ',unit:'раз за минуту',how:'Тест: сядь на стул и встань. Считай, сколько раз успеешь за 60 секунд.',src:'Норма: популяционное исследование 1-мин теста «сесть-встать» (Strassmann и соавт., 2013).'},
  push:{title:'ОТЖИМАНИЯ',unit:'подряд без отдыха',how:'Тест: максимум отжиманий подряд, без пауз и с ровной спиной.',src:'Норма: шкала ACSM / Канадского теста физподготовки.'},
  plank:{title:'ПЛАНКА',unit:'секунд',how:'Тест: планка на предплечьях, держи, пока тело ровное.',src:'Строгих научных норм по возрасту для планки нет, это ориентир.'},

function norm(key,v,age,sex){
  const a=Math.max(18,age);
  if(key==='squat'){
    const m=lerp(SQ[sex],a),sd=m*0.25,lo=Math.round(m-0.674*sd),hi=Math.round(m+0.674*sd);
    const out={band:[lo,hi],max:Math.round(m*1.8),normText:lo+'–'+hi};
    if(v==null)return out;
    const p=phi((v-m)/sd)*100;
    out.pct=Math.round(p);
    if(p>=90){out.rating='ОТЛИЧНО';out.tone='good';}else if(p>=70){out.rating='ВЫШЕ СРЕДНЕГО';out.tone='good';}
    else if(p>=30){out.rating='В НОРМЕ';out.tone='mid';}else if(p>=10){out.rating='НИЖЕ СРЕДНЕГО';out.tone='low';}else{out.rating='НАДО ПОДТЯНУТЬ';out.tone='low';}
    return out;}
  if(key==='push'){
    const br=a<30?20:a<40?30:a<50?40:a<60?50:60;const t=PU[sex][br];
    const out={band:[t[2],t[1]-1],max:Math.round(t[0]*1.5),normText:t[2]+'–'+(t[1]-1)};
    if(v==null)return out;
    if(v>=t[0]){out.rating='ОТЛИЧНО';out.tone='good';}else if(v>=t[1]){out.rating='ОЧЕНЬ ХОРОШО';out.tone='good';}
    else if(v>=t[2]){out.rating='В НОРМЕ';out.tone='mid';}else if(v>=t[3]){out.rating='НИЖЕ НОРМЫ';out.tone='low';}else{out.rating='НАДО ПОДТЯНУТЬ';out.tone='low';}
    return out;}
  if(key==='plank'){
    const f=a<40?1:a<60?0.8:0.6;const t=[30*f,60*f,120*f].map(Math.round);
    const out={band:[t[1],t[2]],max:Math.round(t[2]*1.5),normText:t[1]+'–'+t[2]};
    if(v==null)return out;
    if(v>=t[2]){out.rating='ОТЛИЧНО';out.tone='good';}else if(v>=t[1]){out.rating='ХОРОШО';out.tone='mid';}
    else if(v>=t[0]){out.rating='СРЕДНЕ';out.tone='mid';}else{out.rating='НАДО ПОДТЯНУТЬ';out.tone='low';}
    return out;}
  return null;}

function normLook(look,sex){
  const L=Object.assign({skin:0,hair:0,beard:false},look||{});sex=sex==='f'?'f':'m';

function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=c=>Math.max(0,Math.min(255,Math.round(c*k)));
  return'#'+[n>>16&255,n>>8&255,n&255].map(f).map(v=>v.toString(16).padStart(2,'0')).join('');}
function heroGrid(look,sex,rIdx){
  sex=sex==='f'?'f':'m';const L=normLook(look,sex),o=L.outfit;

function heroInfo(){

  const start=turnDate(b,age),end=turnDate(b,age+1);
  const total=diffDays(start,end),passed=diffDays(start,t);
  return{age,start,end,left:diffDays(t,end),prog:Math.min(100,Math.max(0,passed/total*100))};}
const levelOf=s=>ageAt(parse(S.profile.birth),parse(s));
/* XP is computed from the rules every time (not stored), so a rebalance applies to old entries too. */
const qBase=size=>XP.quest[size||'m']||XP.quest.m;
const hasPhotos=e=>!!((e.photos&&e.photos.length)||e.photo||e.hasPhoto);
function xpMap(){
  const out={},dayUsed={},lastStat={};
  S.events.slice().sort((a,b)=>a.date===b.date?(a.c||0)-(b.c||0):(a.date<b.date?-1:1)).forEach(e=>{
    let v=0;
    if(e.kind==='quest')v=Math.round(qBase(e.size)*(e.mult==null?1:e.mult));
    else if(e.kind==='fail')v=-qBase(e.size);
    else if(e.kind==='step')v=XP.step;
    else if(e.kind==='dream')v=XP.dream;
    else if(e.kind==='manual'){if(!dayUsed[e.date]){dayUsed[e.date]=1;v=XP.manual+(hasPhotos(e)?XP.photo:0);}}
    else if(e.kind==='record'||e.kind==='wealth'){const k=e.kind+':'+(e.stat||'');const lp=lastStat[k];
      if(!lp||diffDays(parse(lp),parse(e.date))>=CAP[e.kind]){v=XP[e.kind];lastStat[k]=e.date;}}
    out[e.id]=v;});
  return out;}
/* Year XP never drops below zero: a failure early in the year is not carried as a debt. */
function xpOfLevel(l,m){m=m||xpMap();const t=todayIso();let total=0;
  S.events.filter(e=>e.date<=t&&levelOf(e.date)===l).sort((a,b)=>a.date===b.date?(a.c||0)-(b.c||0):(a.date<b.date?-1:1))
    .forEach(e=>{total=Math.max(0,total+(m[e.id]||0));});
  return total;}

  return{done:evs.filter(e=>e.kind==='quest'&&(e.mult==null||e.mult>0)).length,failed:evs.filter(e=>e.kind==='fail').length};}

/* ---------- persistence ---------- */
/* Where the data lives:
   on an Android phone  -> window.Native (MainActivity) keeps files in the app's private storage;
   on the page in Claude -> the artifact's own cloud store (window.claude), with localStorage as a quick cache;
   in a plain browser   -> localStorage only.
   Photos are stored one by one, apart from the entries, and entries keep only their ids (e.photos). */
const N=window.Native||null;
const LS_KEY='lifeRpg.v1',LS_PH='lifeRpg.ph.';
const PHOTO={},PH_WAIT={};
const P={db:null,uid:null,prof:null,evCol:null,phCol:null,writing:false,again:false,timer:null,dirty:false,answered:false,resetting:false,pendAdd:new Map(),pendDel:new Set()};
const plain=o=>JSON.parse(JSON.stringify(o));
const saveFail=()=>toast('НЕ ПОЛУЧИЛОСЬ СОХРАНИТЬ. ПРОВЕРЬ СВОБОДНОЕ МЕСТО');
function storeLoad(){
  try{
    if(N){const c=N.loadCore();if(!c)return null;const o=JSON.parse(c);const ev=N.loadEvents();o.events=ev?JSON.parse(ev):[];return o;}
    const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;
  }catch(e){return null;}}
function localAll(){try{localStorage.setItem(LS_KEY,JSON.stringify(Object.assign(core(),{events:S.events})));return true;}catch(e){return false;}}
function persistCore(){try{if(N){if(!N.saveCore(JSON.stringify(core())))saveFail();}else if(!localAll()&&!P.db)saveFail();}catch(e){saveFail();}}
function persistEvents(){try{if(N){if(!N.saveEvents(JSON.stringify(S.events)))saveFail();}else if(!localAll()&&!P.db)saveFail();}catch(e){saveFail();}}
function clearLocal(){
  if(N){try{N.clearAll();}catch(e){}return;}
  try{Object.keys(localStorage).filter(k=>k===LS_KEY||k.indexOf(LS_PH)===0).forEach(k=>localStorage.removeItem(k));}catch(e){}}

/* photos */
function putPhoto(pid,data){PHOTO[pid]=data;if(mode==='demo')return true;
  try{
    if(N){if(N.savePhoto(pid,data))return true;saveFail();return false;}
    if(P.db){P.phCol.doc(pid).set({d:data}).catch(dbError);return true;}
    localStorage.setItem(LS_PH+pid,data);return true;
  }catch(e){saveFail();return false;}}
function dropPhoto(pid){delete PHOTO[pid];if(mode==='demo')return;
  try{if(N){N.deletePhoto(pid);return;}localStorage.removeItem(LS_PH+pid);if(P.db)P.phCol.doc(pid).delete().catch(()=>{});}catch(e){}}
/* The photo if it is already known. Otherwise loading starts, and every <img data-pid> showing it is filled in when it arrives. */
function getPhoto(pid){
  if(pid in PHOTO)return PHOTO[pid];
  try{
    if(N){PHOTO[pid]=N.loadPhoto(pid)||null;return PHOTO[pid];}
    const l=localStorage.getItem(LS_PH+pid);if(l){PHOTO[pid]=l;return l;}
  }catch(e){}
  if(P.db&&!PH_WAIT[pid])PH_WAIT[pid]=P.phCol.doc(pid).get().then(sn=>{PHOTO[pid]=sn.exists?((sn.data()||{}).d||null):null;delete PH_WAIT[pid];paintPhoto(pid);},()=>{delete PH_WAIT[pid];});
  return null;}
function photoAsync(pid){const v=getPhoto(pid);if(v||!PH_WAIT[pid])return Promise.resolve(v||null);return PH_WAIT[pid].then(()=>PHOTO[pid]||null);}
function paintPhoto(pid){const d=PHOTO[pid];if(!d)return;document.querySelectorAll('img[data-pid]').forEach(i=>{if(i.dataset.pid===pid)i.src=d;});}
/* Older saves kept one photo inside the entry (e.photo) or a file named after it (e.hasPhoto). */
function migratePhotos(){const changed=[];
  S.events.forEach(e=>{
    if(e.photo){PHOTO[e.id]=e.photo;if(mode!=='demo')putPhoto(e.id,e.photo);e.photos=[e.id];delete e.photo;changed.push(e);}
    else if(e.hasPhoto){e.photos=[e.id];delete e.hasPhoto;changed.push(e);}});
  return changed;}

function saveCore(){if(mode==='demo')return;S.rev=Math.max(Date.now(),(S.rev||0)+1);persistCore();syncReminders();
  if(P.db){P.dirty=true;clearTimeout(P.timer);P.timer=setTimeout(writeCore,500);}}
async function writeCore(){
  if(!P.db)return;if(P.writing){P.again=true;return;}
  P.writing=true;
  try{await P.prof.set(plain(core()));}catch(e){dbError(e);}
  P.writing=false;
  if(P.again){P.again=false;writeCore();}else P.dirty=false;}
function saveEvent(ev){if(mode==='demo')return;persistEvents();syncReminders();
  if(P.db){P.pendAdd.set(ev.id,ev);P.evCol.doc(ev.id).set(plain(ev)).then(()=>P.pendAdd.delete(ev.id),e=>{P.pendAdd.delete(ev.id);dbError(e);});}}
function dropEvent(id){if(mode==='demo')return;persistEvents();syncReminders();
  if(P.db){P.pendAdd.delete(id);P.pendDel.add(id);P.evCol.doc(id).delete().then(()=>P.pendDel.delete(id),e=>{P.pendDel.delete(id);dbError(e);});}}
function dbError(e){const c=e&&e.code;
  if(c==='quota_exceeded')toast('ХРАНИЛИЩЕ ЗАПОЛНЕНО. УДАЛИ СТАРЫЕ ЗАПИСИ С ФОТО');
  else if(c==='invalid_argument')toast('ЗАПИСЬ НЕ СОХРАНИЛАСЬ: ВОЗМОЖНО, ФОТО СЛИШКОМ БОЛЬШОЕ');
  else if(c==='revoked'||c==='not_granted'){P.db=null;toast('ОБЛАКО НЕДОСТУПНО. СОХРАНЯЮ НА ЭТОМ УСТРОЙСТВЕ');}
  else toast('НЕ ПОЛУЧИЛОСЬ СОХРАНИТЬ. ДАННЫЕ ОСТАЛИСЬ НА УСТРОЙСТВЕ');}

/* Cloud (only on the page inside Claude). The profile is applied only when it is newer than ours (rev),
   so an older or echoed copy never wipes a change that was just made. */
async function initCloud(){
  if(N)return;const C=window.claude;if(!C||typeof C.use!=='function')return;
  let db=null,user=null;
  try{[db,user]=await Promise.all([C.use('db'),C.use('user')]);}catch(e){return;}
  if(!db||!user)return;
  let id=null;try{id=await user.id();}catch(e){}
  if(!id)return;
  P.db=db;P.uid=id;P.prof=db.doc('data/users/'+id+'/profile');P.evCol=P.prof.collection('events');P.phCol=P.prof.collection('photos');
  const timer=setTimeout(()=>{if(!P.answered)toast('ОБЛАКО ПОКА НЕ ОТВЕЧАЕТ. ДАННЫЕ СОХРАНЯЮТСЯ НА ЭТОМ УСТРОЙСТВЕ');},10000);
  const answered=()=>{if(!P.answered){P.answered=true;clearTimeout(timer);}};
  const fail=e=>{clearTimeout(timer);dbError(e);};
  let evDocs=null,profSeen=false;
  const takeEvents=()=>{S.events=mergeEvents(evDocs);migratePhotos().forEach(saveEvent);};
  P.prof.onSnapshot(sn=>{
    answered();if(P.resetting)return;
    const busy=P.dirty||P.writing;
    if(sn.exists){
      const d=sn.data()||{},rr=d.rev||0,lr=S.rev||0;
      if(mode==='demo'||(rr>lr&&!busy)){applyCore(d);if(evDocs)takeEvents();else if(mode==='demo')S.events=[];mode='db';processQuests();lastRankShown=null;rankCheck(true);localAll();render();}
      else if(rr<lr&&!busy){mode='db';writeCore();}
      else mode='db';
    }else if(mode!=='demo'&&S.profile){
      mode='db';writeCore();
      S.events.forEach(ev=>{saveEvent(ev);(ev.photos||[]).forEach(pid=>{const d=getPhoto(pid);if(d)P.phCol.doc(pid).set({d}).catch(dbError);});});}
    profSeen=true;
  },fail);
  P.evCol.onSnapshot(sn=>{
    answered();evDocs=sn.docs.map(x=>x.data());
    if(!profSeen||P.resetting||mode==='demo')return;
    takeEvents();localAll();render();
  },fail);
}
function mergeEvents(docs){const ids=new Set(docs.map(e=>e.id));
  return docs.filter(e=>!P.pendDel.has(e.id)).concat([...P.pendAdd.values()].filter(e=>!ids.has(e.id)));}

let pendingRestore=null;
function readRestore(file){const r=new FileReader();r.onload=()=>{let d=null;try{d=JSON.parse(r.result);}catch(e){}

/* ---------- quests: moving and failing ----------
   On the deadline day a quest can be moved to tomorrow once for half the XP.
   A second move, or a deadline that passes without a move, is a failure: minus the full reward.
   A failed quest stays in the list and moves to the next day by itself; finishing it gives 0 XP. */
function qReward(q){if(q.failed||(q.moves||0)>=2)return 0;return(q.moves||0)===1?Math.round(qBase(q.size)/2):qBase(q.size);}
function failQuest(q,date,why){if(q.failed)return null;q.failed=true;q.failedAt=date;
  const ev=addEvent({date,kind:'fail',size:q.size||'m',qid:q.id,text:'Задание провалено: '+q.title+(why?' ('+why+')':'')});q.failEventId=ev.id;return ev;}
function processQuests(){
  if(mode==='demo'||!S.profile)return[];const t=todayIso(),evs=[];let changed=false;
  S.quests.forEach(q=>{if(q.done||!q.due||q.due>=t)return;
    if(!q.failed){const next=iso(addDays(parse(q.due),1));const ev=failQuest(q,next<t?next:t,'срок прошёл');if(ev)evs.push(ev);}
    q.due=t;changed=true;});
  if(changed)saveCore();
  return evs;}
function moveQuest(id){const q=S.quests.find(x=>x.id===id);if(!q||q.done||q.failed||q.due!==todayIso())return;
  q.moves=(q.moves||0)+1;q.due=iso(addDays(today(),1));
  if(q.moves>=2){const ev=failQuest(q,todayIso(),'второй перенос');saveCore();render();gain(ev,'ЗАДАНИЕ ПРОВАЛЕНО');return;}
  saveCore();render();toast('ПЕРЕНЕСЕНО НА ЗАВТРА · НАГРАДА '+qReward(q)+' XP');}
function toggleQuest(id){const q=S.quests.find(x=>x.id===id);if(!q)return;
  if(!q.done){const mult=q.failed?0:((q.moves||0)===1?0.5:1);q.done=true;q.doneAt=todayIso();q.earned=Math.round(qBase(q.size)*mult);
    const ev=addEvent({kind:'quest',size:q.size||'m',mult,qid:q.id,text:'Задание выполнено: '+q.title+(q.failed?' (после провала)':q.moves?' (с переносом)':'')});
    q.eventId=ev.id;gain(ev,q.failed?'СДЕЛАНО, НО ПОСЛЕ ПРОВАЛА':'ЗАДАНИЕ');}
  else{q.done=false;delete q.doneAt;delete q.earned;if(q.eventId)removeEvent(q.eventId);delete q.eventId;processQuests();lastRankShown=null;rankCheck(true);}
  saveCore();render();}
function deleteQuest(id,asFail){const q=S.quests.find(x=>x.id===id);if(!q)return;let ev=null;
  if(asFail)ev=failQuest(q,todayIso(),'удалено');
  S.quests=S.quests.filter(x=>x.id!==id);saveCore();render();if(ev)gain(ev,'ЗАДАНИЕ ПРОВАЛЕНО');else toast('ЗАДАНИЕ УДАЛЕНО');}
function toggleStep(id){const s=S.dream&&S.dream.steps.find(x=>x.id===id);if(!s)return;
  if(!s.done){s.done=true;const ev=addEvent({kind:'step',text:'Шаг к мечте: '+s.text});s.eventId=ev.id;gain(ev,'ШАГ К МЕЧТЕ');}
  else{s.done=false;if(s.eventId)removeEvent(s.eventId);delete s.eventId;lastRankShown=null;rankCheck();}

function recordStat(key,v){

  S.stats[key]=others.concat([{d:t,v}]).sort((a,b)=>a.d<b.d?-1:1);
  if(key!=='cal'&&prevMax!==null&&v>prevMax&&!S.events.some(e=>e.kind==='record'&&e.date===t&&e.stat===key)){
    const ev=addEvent({kind:'record',stat:key,text:'Новый рекорд: '+STAT_META[key].title.toLowerCase()+', '+v+' '+STAT_META[key].unit});gain(ev,'НОВЫЙ РЕКОРД');}

let VW=null;
function openViewer(evId,idx){const e=S.events.find(x=>x.id===evId);if(!e||!e.photos||!e.photos.length)return;VW={pids:e.photos.slice(),i:Math.min(idx||0,e.photos.length-1),s:1,x:0,y:0};renderViewer();}
function closeViewer(){VW=null;renderViewer();}
function stepViewer(d){if(!VW)return;VW.i=(VW.i+d+VW.pids.length)%VW.pids.length;VW.s=1;VW.x=0;VW.y=0;renderViewer();}
function renderViewer(){const r=document.getElementById('viewerRoot');if(!VW){r.innerHTML='';return;}
  const pid=VW.pids[VW.i],d=getPhoto(pid),many=VW.pids.length>1;
  r.innerHTML='<div class="viewer" role="dialog" aria-modal="true" aria-label="Просмотр фото"><div class="vw-top"><span>'+(many?(VW.i+1)+' / '+VW.pids.length:'ФОТО')+'</span><button class="navbtn" data-act="vw-close" aria-label="Закрыть просмотр">✕</button></div>'+
    '<div class="vw-stage" id="vwStage"><img id="vwImg" data-pid="'+esc(pid)+'"'+(d?' src="'+d+'"':'')+' alt="Фото '+(VW.i+1)+'" draggable="false"></div>'+
    '<div class="vw-bottom">'+(many?'<button class="navbtn" data-act="vw-prev" aria-label="Предыдущее фото">◄</button>':'<span></span>')+'<span>ДВА ТАПА: УВЕЛИЧИТЬ</span>'+(many?'<button class="navbtn" data-act="vw-next" aria-label="Следующее фото">►</button>':'<span></span>')+'</div></div>';
  const st=document.getElementById('vwStage'),im=document.getElementById('vwImg');
  const pts=new Map();let d0=0,s0=1,last=null,downX=null,moved=false,lastTap=0;
  const apply=()=>{im.style.transform='translate('+VW.x+'px,'+VW.y+'px) scale('+VW.s+')';};
  st.addEventListener('pointerdown',ev=>{try{st.setPointerCapture(ev.pointerId);}catch(e){}pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(pts.size===2){const[a,b]=[...pts.values()];d0=Math.hypot(a.x-b.x,a.y-b.y)||1;s0=VW.s;moved=true;}
    else{last={x:ev.clientX,y:ev.clientY};downX=ev.clientX;moved=false;}});
  st.addEventListener('pointermove',ev=>{if(!pts.has(ev.pointerId))return;pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(pts.size===2){const[a,b]=[...pts.values()];VW.s=Math.min(5,Math.max(1,s0*Math.hypot(a.x-b.x,a.y-b.y)/d0));if(VW.s===1){VW.x=0;VW.y=0;}apply();}
    else if(last){const dx=ev.clientX-last.x,dy=ev.clientY-last.y;if(Math.abs(ev.clientX-downX)>6)moved=true;if(VW.s>1){VW.x+=dx;VW.y+=dy;apply();}last={x:ev.clientX,y:ev.clientY};}});
  const up=ev=>{if(!pts.has(ev.pointerId))return;pts.delete(ev.pointerId);
    if(pts.size){last=null;return;}
    if(VW.s===1&&downX!==null&&Math.abs(ev.clientX-downX)>60&&many){stepViewer(ev.clientX<downX?1:-1);return;}
    if(!moved){const now=Date.now();if(now-lastTap<320){if(VW.s>1){VW.s=1;VW.x=0;VW.y=0;}else VW.s=2.5;apply();lastTap=0;}else lastTap=now;}
    last=null;downX=null;};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);}

function saveFinance(form){
  const n=id=>{const v=form.querySelector(id).value.trim();return v===''?null:Number(v);};
  const income=n('#fIncome'),people=n('#fPeople')||1,family=n('#fFamily'),area=n('#fArea'),year=n('#fCarYear');
  const carName=form.querySelector('#fCarName').value.trim();const home=(form.querySelector('input[name="home"]:checked')||{}).value||'own';
  if([income,family,area].some(v=>v!=null&&(!isFinite(v)||v<0))){showErr('fErr','Суммы и площадь должны быть положительными числами.');return false;}
  if(!isFinite(people)||people<1||people>20){showErr('fErr','Сколько человек живёт вместе: от 1 до 20.');return false;}
  if(year!=null&&(year<1950||year>today().getFullYear()+1)){showErr('fErr','Проверь год выпуска машины.');return false;}
  const prev=S.fin,t=todayIso();const hist=prev&&prev.hist?prev.hist:{income:[],area:[]};
  const push=(arr,v)=>v?arr.filter(x=>x.d!==t).concat([{d:t,v}]).sort((a,b)=>a.d<b.d?-1:1):arr;
  const evs=[];const sameDay=stat=>S.events.some(e=>e.kind==='wealth'&&e.date===t&&e.stat===stat);
  if(prev){
    const maxOf=(arr,fb)=>{const o=arr.filter(x=>x.d!==t).map(x=>x.v);if(fb)o.push(fb);return o.length?Math.max(...o):null;};
    const mi=maxOf(hist.income||[],null),ma=maxOf(hist.area||[],null);
    if(income&&mi&&income>mi&&!sameDay('income')){evs.push(addEvent({kind:'wealth',stat:'income',text:'Доход вырос: теперь '+rub(income)+' в месяц'}));}
    if(area&&ma&&area>ma&&!sameDay('area')){evs.push(addEvent({kind:'wealth',stat:'area',text:'Жильё стало просторнее: теперь '+num1(area)+' м²'}));}
    const pc=prev.car||{};if(carName&&(pc.name!==carName||(pc.year||null)!==year)&&!sameDay('car')){evs.push(addEvent({kind:'wealth',stat:'car',text:'Новая машина: '+carName+(year?', '+year+' г.':'')}));}
  }
  S.fin={income,familyIncome:family,people,area,home,car:carName?{name:carName,year}:null,hist:{income:push(hist.income||[],income),area:push(hist.area||[],area)}};
  saveCore();closeModal();render();
  if(evs.length)gain(evs,'РОСТ ДОСТАТКА');else toast('ДОСТАТОК ОБНОВЛЁН');
  return true;}

function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  let max=900,q=0.75,out='';for(let k=0;k<6;k++){const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<170000)break;max=Math.round(max*0.8);q=Math.max(0.5,q-0.07);}
  res(out);};img.src=r.result;};r.readAsDataURL(file);});}

  if(a==='add-entry'){entryModal(null);return;}
  if(a==='del-entry'){confirmModal('Запись исчезнет из ленты вместе с опытом за неё.','УДАЛИТЬ','do-del-entry');document.querySelector('[data-act="do-del-entry"]').dataset.id=id;return;}
  if(a==='do-del-entry'){removeEvent(id);closeModal();lastRankShown=null;rankCheck();render();toast('ЗАПИСЬ УДАЛЕНА');return;}
  if(a==='reset'){confirmModal('Герой, задания, мечта и вся лента жизни будут удалены без возможности вернуть.','УДАЛИТЬ ВСЁ','do-reset');return;}
  if(a==='do-reset'){doReset();return;}
  if(a==='backup'){doBackup();return;}
  if(a==='restore'){const i=document.getElementById('restoreFile');if(i){i.value='';i.click();}return;}
  if(a==='do-restore'){doRestore();return;}
});
async function doReset(){closeModal();const evs=S.events.slice();P.resetting=true;clearLocal();
  if(P.db){clearTimeout(P.timer);try{for(const ev of evs){for(const pid of ev.photos||[])await P.phCol.doc(pid).delete();await P.evCol.doc(ev.id).delete();}await P.prof.delete();}catch(e){dbError(e);}P.dirty=false;}
  P.resetting=false;Object.keys(PHOTO).forEach(k=>delete PHOTO[k]);
  applyAll(demoState());mode='demo';syncReminders();lastRankShown=null;location.hash='#hero';render();toast('ДАННЫЕ УДАЛЕНЫ');}
document.addEventListener('submit',e=>{
  const f=e.target;const k=f.dataset.form;if(!k)return;e.preventDefault();
  if(k==='profile'){const name=f.querySelector('#pName').value.trim(),birth=f.querySelector('#pBirth').value;
    if(!name){showErr('pErr','Впиши имя героя.');return;}
    if(!birth||birth>todayIso()||parse(birth).getFullYear()<1900){showErr('pErr','Укажи настоящую дату рождения: от неё считается уровень.');return;}
    const sex=(f.querySelector('input[name="sex"]:checked')||{}).value||'m';const look=readLook(f);
    const rem=f.querySelector('#rDaily')?{daily:f.querySelector('#rDaily').checked,deadlines:f.querySelector('#rDead').checked,time:f.querySelector('#rTime').value||'21:00'}:null;
    const askPerm=()=>{if(N&&rem&&(rem.daily||rem.deadlines)&&N.requestNotifications){try{N.requestNotifications();}catch(e){}}};
    if(mode==='demo'){applyAll(emptyState());look.outfit=Object.assign({},PRESETS.casual,{color:0});S.profile={name,birth,sex,look};if(rem)S.settings={remind:rem};mode=P.db?'db':'local';
      addEvent({kind:'start',text:'Герой '+name+' начал свой путь на уровне '+ageAt(parse(birth),today())+'.',xp:0});saveCore();closeModal();lastRankShown=0;location.hash='#hero';view='hero';render();toast('ПУТЬ НАЧАЛСЯ!',true);askPerm();}
    else{look.gear=(S.profile.look||{}).gear;look.outfit=(S.profile.look||{}).outfit;S.profile={name,birth,sex,look};if(rem)S.settings=Object.assign({},S.settings,{remind:rem});saveCore();askPerm();closeModal();render();toast('ПРОФИЛЬ СОХРАНЁН');}
    return;}
  if(k==='finance'){saveFinance(f);return;}
  if(k==='wardrobe'){S.profile.look=Object.assign({},S.profile.look,f._read());saveCore();closeModal();render();toast('ГЕРОЙ ПЕРЕОДЕТ');return;}
  if(k==='quest'){const t=f.querySelector('#qTitle').value.trim(),d=f.querySelector('#qDue').value;
    if(!t){showErr('qErr','Напиши, чего хочешь.');return;}if(!d){showErr('qErr','Выбери срок: без даты желание так и останется желанием.');return;}
    const size=(f.querySelector('input[name="qsize"]:checked')||{}).value||'m';S.quests.push({id:uid(),title:t,due:d,size,done:false});saveCore();closeModal();render();toast('ЗАДАНИЕ ПРИНЯТО');return;}
  if(k==='dream'){const t=f.querySelector('#dTitle').value.trim(),w=f.querySelector('#dWhy').value.trim();
    if(!t){showErr('dErr','Назови мечту хотя бы парой слов.');return;}
    if(!S.dream)S.dream={title:t,why:w,steps:[]};else{S.dream.title=t;S.dream.why=w;}saveCore();closeModal();location.hash='#dream';render();return;}
  if(k==='step'){const t=f.querySelector('#stepText').value.trim(),d=f.querySelector('#stepDue').value;
    if(!t){showErr('stepErr','Опиши шаг.');return;}S.dream.steps.push({id:uid(),text:t,due:d||null,done:false});saveCore();render();setTimeout(()=>{const i=document.getElementById('stepText');if(i)i.focus();},0);return;}
  if(k==='entry'){const d=f.querySelector('#eDate').value,t=f.querySelector('#eText').value.trim();
    if(!ED)return;if(ED.busy){showErr('eErr','Подожди, фото ещё обрабатывается.');return;}
    if(!d){showErr('eErr','Выбери дату.');return;}if(!t&&!ED.photos.length){showErr('eErr','Напиши пару слов или добавь фото.');return;}
    const pids=ED.photos.map(p=>p.pid);
    ED.photos.filter(p=>p.isNew).forEach(p=>putPhoto(p.pid,p.data));ED.removed.forEach(dropPhoto);
    if(ED.id){const ev=S.events.find(e=>e.id===ED.id);if(ev){ev.date=d;ev.text=t;if(pids.length)ev.photos=pids;else delete ev.photos;saveEvent(ev);}
      ED=null;closeModal();render();lastRankShown=null;rankCheck(true);toast('ЗАПИСЬ ИЗМЕНЕНА');return;}
    const o={date:d,kind:'manual',text:t};if(pids.length)o.photos=pids;const ev=addEvent(o);
    ED=null;closeModal();render();if(d<=todayIso())gain(ev,'ЗАПИСЬ В ЛЕНТЕ');else toast('ДОБАВЛЕНО В «ВПЕРЕДИ»');return;}
  if(k==='stat'){const key=f.dataset.key;const inp=f.querySelector('input');const v=Number(inp.value);
    if(inp.value===''||!isFinite(v)||v<0){inp.focus();toast('ВПИШИ ЧИСЛО');return;}recordStat(key,Math.round(v));return;}
});
document.getElementById('restoreFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)readRestore(f);});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(VW)closeViewer();else if(document.querySelector('.overlay'))closeModal();});
function checkDay(){const evs=processQuests();if(evs.length){const m=xpMap(),v=evs.reduce((a,e)=>a+(m[e.id]||0),0);
  const rm=rankCheck(true);toast('ПРОВАЛЕНО ЗАДАНИЙ: '+evs.length+' · '+signed(v)+(rm?' · '+rm:''),false);}}
function route(){const h=(location.hash||'').replace('#','');view=['hero','stats','dream','life'].includes(h)?h:'hero';checkDay();render();window.scrollTo(0,0);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.profile){checkDay();render();}});
window.addEventListener('hashchange',route);

/* ---------- boot ---------- */
const local=storeLoad();
if(local&&local.profile){applyAll(local);mode='local';if(migratePhotos().length)persistEvents();}else{applyAll(demoState());mode='demo';}
try{lastRankShown=rankIdx(xpOfLevel(heroInfo().age));}catch(e){lastRankShown=0;}
route();
syncReminders();
initCloud();
})();
</script>
